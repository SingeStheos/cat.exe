name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output: main
            compiler: g++
          - os: windows-latest
            output: main.exe
            compiler: g++
          - os: macos-latest
            output: main
            compiler: clang++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: ${{ matrix.compiler }} -std=c++17 -O2 -o ${{ matrix.output }} main.cpp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.os }}
          path: ${{ matrix.output }}
